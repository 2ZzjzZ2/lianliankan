<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的专属照片连连看 - 多模式挑战</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 0.8);
        }
        /* 动态网格样式 */
        .grid-10 {
            display: grid;
            grid-template-columns: repeat(10, minmax(42px, 1fr));
            grid-template-rows: repeat(10, minmax(42px, 1fr));
            gap: 3px;
        }
        .grid-15 {
            display: grid;
            grid-template-columns: repeat(15, minmax(32px, 1fr));
            grid-template-rows: repeat(15, minmax(32px, 1fr));
            gap: 2px;
        }
        .grid-20 {
            display: grid;
            grid-template-columns: repeat(20, minmax(26px, 1fr));
            grid-template-rows: repeat(20, minmax(26px, 1fr));
            gap: 2px;
        }
        .tile {
            aspect-ratio: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
        .tile:hover {
            transform: scale(1.12);
            z-index: 10;
        }
        .tile.selected {
            transform: scale(1.15);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.9);
            border-color: #3b82f6 !important;
            background-color: #eff6ff !important;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        @keyframes hintGlow {
            0%, 100% { box-shadow: 0 0 5px #f59e0b; transform: scale(1); }
            50% { box-shadow: 0 0 22px #f59e0b; transform: scale(1.12); }
        }
        .hint-tile {
            animation: hintGlow 0.8s infinite ease-in-out;
            border-color: #f59e0b !important;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col items-center justify-start min-h-screen p-2 sm:p-4">

    <header class="w-full max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between glass-panel rounded-2xl p-4 shadow-lg mb-3">
        <div class="flex items-center space-x-3 mb-3 sm:mb-0">
            <div class="bg-gradient-to-tr from-indigo-500 to-pink-500 text-white p-3 rounded-xl shadow-md">
                <i class="fa-solid fa-heart text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-indigo-600 to-pink-600 bg-clip-text text-transparent">
                    我的专属照片连连看
                </h1>
                <p id="mode-subtitle" class="text-xs text-slate-500">当前模式：一般 (15×15) · 已绑定 1.jpg - 20.jpg · 保证可解</p>
            </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="flex flex-wrap items-center justify-center gap-2">
            <button id="btn-start" onclick="showDifficultyModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-2">
                <i class="fa-solid fa-gear"></i> 选择难度开始
            </button>
            <button id="btn-pause" onclick="togglePause()" class="px-3 py-2 bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-1.5 hidden">
                <i class="fa-solid fa-pause"></i> 暂停
            </button>
            <button onclick="shuffleTiles()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-1.5" title="打乱当前未消除方块位置（确保有解）">
                <i class="fa-solid fa-shuffle"></i> 刷新 (<span id="shuffle-count">3</span>)
            </button>
            <button onclick="showHint()" class="px-3 py-2 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-1.5" title="显示一组可消除线索">
                <i class="fa-solid fa-lightbulb"></i> 提示 (<span id="hint-count">5</span>)
            </button>
        </div>
    </header>

    <div class="w-full max-w-6xl mx-auto glass-panel rounded-2xl p-3.5 shadow-md mb-3 flex flex-col md:flex-row items-center justify-between gap-4">
        <!-- Timer Section -->
        <div class="w-full md:w-1/3 flex flex-col gap-1.5">
            <div class="flex justify-between text-sm font-bold">
                <span class="flex items-center gap-1.5 text-slate-600"><i class="fa-solid fa-stopwatch text-indigo-500"></i> 剩余时间</span>
                <span id="timer-text" class="text-indigo-600 font-mono text-base">300s</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-3.5 overflow-hidden shadow-inner">
                <div id="timer-bar" class="bg-gradient-to-r from-indigo-500 to-pink-500 h-full w-full transition-all duration-1000 rounded-full"></div>
            </div>
        </div>

        <!-- Score & Status -->
        <div class="flex items-center justify-around w-full md:w-1/3 gap-3 text-center">
            <div class="bg-white/80 px-3 py-1.5 rounded-xl shadow-sm border border-white flex-1">
                <div class="text-[11px] text-slate-400 font-semibold uppercase">当前得分</div>
                <div id="score-val" class="text-lg font-bold text-slate-800">0</div>
            </div>
            <div class="bg-white/80 px-3 py-1.5 rounded-xl shadow-sm border border-white flex-1">
                <div class="text-[11px] text-slate-400 font-semibold uppercase">剩余方块</div>
                <div id="pairs-left" class="text-lg font-bold text-pink-600">225</div>
            </div>
            <div class="bg-white/80 px-3 py-1.5 rounded-xl shadow-sm border border-white flex-1">
                <div class="text-[11px] text-slate-400 font-semibold uppercase">连击奖励</div>
                <div id="combo-val" class="text-lg font-bold text-amber-500">1x</div>
            </div>
        </div>

        <!-- Optional local backup loader -->
        <div class="w-full md:w-auto flex items-center justify-center">
            <label class="cursor-pointer bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition flex items-center gap-2" title="如果您在本地电脑直接双击打开遇到浏览器安全拦截，可点此按钮重新选取本地1-20.jpg照片">
                <i class="fa-solid fa-folder-open"></i> 本地浏览备用：选择1-20.jpg
                <input type="file" multiple accept="image/*" class="hidden" onchange="handleLocalFilesSelected(event)">
            </label>
        </div>
    </div>

    <main class="w-full max-w-6xl mx-auto glass-panel rounded-3xl p-3 sm:p-5 shadow-xl relative flex flex-col items-center justify-center overflow-x-auto">
        
        <!-- Canvas for connecting lines overlay -->
        <canvas id="line-canvas" class="absolute inset-0 pointer-events-none z-30 w-full h-full rounded-3xl"></canvas>

        <!-- Grid Wrapper with Scroll support -->
        <div id="board-container" class="relative max-h-[72vh] overflow-auto p-1 flex items-center justify-center">
            <div id="tile-grid" class="grid-15">
                <!-- Tiles injected via JS -->
            </div>
        </div>

        <!-- Overlay for Game States & Difficulty Selection Modal -->
        <div id="game-overlay" class="absolute inset-0 bg-slate-900/75 backdrop-blur-md z-40 flex flex-col items-center justify-center rounded-3xl transition-opacity duration-300 p-4">
            <div id="overlay-content" class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl text-center max-w-lg w-full mx-4 border border-white/30">
                <div id="overlay-icon" class="w-16 h-16 bg-pink-100 text-pink-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <h2 id="overlay-title" class="text-2xl font-bold text-slate-800 mb-2">选择游戏难度</h2>
                <p id="overlay-desc" class="text-slate-600 text-sm mb-6 leading-relaxed">
                    请选择您喜欢的挑战模式（点击按钮即刻开局）：
                </p>

                <!-- Difficulty Options -->
                <div id="difficulty-selector" class="flex flex-col gap-3 mb-4">
                    <button onclick="selectDifficulty('easy')" class="w-full py-3.5 px-4 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-400 text-emerald-800 font-bold rounded-xl shadow transition flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-seedling text-emerald-600"></i> 简单模式</span>
                        <span class="text-xs bg-emerald-200 text-emerald-900 px-2.5 py-1 rounded-lg font-mono">10 × 10 | 200 秒</span>
                    </button>
                    <button onclick="selectDifficulty('medium')" class="w-full py-3.5 px-4 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-400 text-indigo-800 font-bold rounded-xl shadow transition flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-fire text-indigo-600"></i> 一般模式</span>
                        <span class="text-xs bg-indigo-200 text-indigo-900 px-2.5 py-1 rounded-lg font-mono">15 × 15 | 300 秒</span>
                    </button>
                    <button onclick="selectDifficulty('hard')" class="w-full py-3.5 px-4 bg-pink-50 hover:bg-pink-100 border-2 border-pink-400 text-pink-800 font-bold rounded-xl shadow transition flex items-center justify-between">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-skull text-pink-600"></i> 困难模式</span>
                        <span class="text-xs bg-pink-200 text-pink-900 px-2.5 py-1 rounded-lg font-mono">20 × 20 | 400 秒</span>
                    </button>
                </div>

                <div id="overlay-action-container" class="hidden">
                    <button id="overlay-main-btn" onclick="startGame()" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-700 hover:to-pink-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-98 flex items-center justify-center gap-2 text-base">
                        <i class="fa-solid fa-rocket"></i> 开始游戏
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-3 text-center text-xs text-slate-500">
        <p>✨ 规则：点击两个相同照片，连线转折不超过2次即可消除。每次洗牌或开局均由算法保证 100% 场上有解！</p>
    </footer>

    <script>
        // Difficulty configurations
        let currentDifficulty = 'medium';
        let ROWS = 15;
        let COLS = 15;
        let GAME_DURATION = 300;

        function selectDifficulty(mode) {
            currentDifficulty = mode;
            if (mode === 'easy') {
                ROWS = 10; COLS = 10; GAME_DURATION = 200;
            } else if (mode === 'medium') {
                ROWS = 15; COLS = 15; GAME_DURATION = 300;
            } else if (mode === 'hard') {
                ROWS = 20; COLS = 20; GAME_DURATION = 400;
            }

            document.getElementById('mode-subtitle').innerText = `当前模式：${mode==='easy'?'简单 (10×10)':mode==='medium'?'一般 (15×15)':'困难 (20×20)'} · 已绑定 1.jpg - 20.jpg · 保证可解`;
            startGame();
        }

        function showDifficultyModal() {
            gameState = 'PAUSED';
            if (timerInterval) clearInterval(timerInterval);
            
            document.getElementById('overlay-title').innerText = '选择游戏难度';
            document.getElementById('overlay-desc').innerText = '请选择您喜欢的挑战模式：';
            document.getElementById('overlay-icon').innerHTML = '<i class="fa-solid fa-gear"></i>';
            document.getElementById('difficulty-selector').classList.remove('hidden');
            document.getElementById('overlay-action-container').classList.add('hidden');
            
            const overlay = document.getElementById('game-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Image URLs: strictly 1.jpg to 20.jpg from GitHub root directory[cite: 12]
        let imageUrls = [];
        for (let i = 1; i <= 20; i++) {
            imageUrls.push(`${i}.jpg`);
        }

        // Fallback display if image fails to load
        const FALLBACK_LABELS = [
            "1号", "2号", "3号", "4号", "5号", "6号", "7号", "8号", "9号", "10号",
            "11号", "12号", "13号", "14号", "15号", "16号", "17号", "18号", "19号", "20号"
        ];

        let board = []; 
        let gameState = 'IDLE'; 
        let timeLeft = GAME_DURATION;
        let timerInterval = null;
        let score = 0;
        let combo = 1;
        let shuffleCount = 3;
        let hintCount = 5;
        let selectedTile = null;

        // Web Audio Synthesizer for feedback sounds[cite: 12]
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playMatchSound() {
            playTone(587.33, 'sine', 0.1);
            setTimeout(() => playTone(880, 'sine', 0.2), 80);
        }
        function playErrorSound() {
            playTone(200, 'sawtooth', 0.15);
        }
        function playWinSound() {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                setTimeout(() => playTone(f, 'triangle', 0.25), i * 120);
            });
        }

        // Optional local file selector for direct file:// debugging[cite: 12]
        function handleLocalFilesSelected(event) {
            const files = Array.from(event.target.files);
            if (files.length === 0) return;
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            let newUrls = [];
            for (let i = 0; i < Math.min(files.length, 20); i++) {
                newUrls.push(URL.createObjectURL(files[i]));
            }
            while (newUrls.length < 20) {
                newUrls.push(newUrls[newUrls.length % files.length]);
            }
            imageUrls = newUrls;
            showToast(`成功加载 ${files.length} 张本地照片！`);
            hideOverlay();
            startGame();
        }

        // Guaranteed Solvable Board Generation[cite: 12]
        function generateSolvableBoard() {
            const totalPairs = (ROWS * COLS) / 2; 
            let flatList = [];
            
            for (let i = 0; i < totalPairs; i++) {
                let imgIndex = i % 20; 
                flatList.push(imgIndex);
                flatList.push(imgIndex);
            }

            for (let i = flatList.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [flatList[i], flatList[j]] = [flatList[j], flatList[i]];
            }

            board = [];
            let idx = 0;
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push(flatList[idx++]);
                }
                board.push(row);
            }

            if (!hasValidMoves()) {
                shuffleTilesSilently();
            }
        }

        function shuffleTilesSilently() {
            let tiles = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== -1) {
                        tiles.push(board[r][c]);
                    }
                }
            }

            let attempts = 0;
            do {
                for (let i = tiles.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
                }
                
                let idx = 0;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c] !== -1) {
                            board[r][c] = tiles[idx++];
                        }
                    }
                }
                attempts++;
            } while (!hasValidMoves() && attempts < 50);
        }

        function shuffleTiles() {
            if (gameState !== 'PLAYING') return;
            if (shuffleCount <= 0) {
                showToast("洗牌次数已用完！");
                return;
            }
            shuffleCount--;
            document.getElementById('shuffle-count').innerText = shuffleCount;
            shuffleTilesSilently();
            renderBoard();
            selectedTile = null;
            playTone(440, 'triangle', 0.2);
            showToast("棋盘已重新洗牌（保证有解）！");
        }

        // Pathfinding: Connect with <= 2 corner turns (3 straight segments)[cite: 12]
        function checkConnect(p1, p2) {
            if (p1.r === p2.r && p1.c === p2.c) return null;
            if (board[p1.r][p1.c] !== board[p2.r][p2.c]) return null;
            if (board[p1.r][p1.c] === -1) return null;

            let r1 = p1.r, c1 = p1.c;
            let r2 = p2.r, c2 = p2.c;

            if (checkDirect(r1, c1, r2, c2)) {
                return [ {r: r1, c: c1}, {r: r2, c: c2} ];
            }

            let corners1 = [{r: r1, c: c2}, {r: r2, c: c1}];
            for (let corner of corners1) {
                if (checkDirect(r1, c1, corner.r, corner.c) && checkDirect(corner.r, corner.c, r2, c2)) {
                    return [ {r: r1, c: c1}, corner, {r: r2, c: c2} ];
                }
            }

            for (let r = -1; r <= ROWS; r++) {
                if ((r === -1 || r === ROWS || board[r][c1] === -1) &&
                    (r === -1 || r === ROWS || board[r][c2] === -1)) {
                    if (checkDirect(r1, c1, r, c1) && checkDirect(r2, c2, r, c2) && checkDirect(r, c1, r, c2)) {
                        return [ {r: r1, c: c1}, {r: r, c: c1}, {r: r, c: c2}, {r: r2, c: c2} ];
                    }
                }
            }

            for (let c = -1; c <= COLS; c++) {
                if ((c === -1 || c === COLS || board[r1][c] === -1) &&
                    (c === -1 || c === COLS || board[r2][c] === -1)) {
                    if (checkDirect(r1, c1, r1, c) && checkDirect(r2, c2, r2, c) && checkDirect(r1, c, r2, c)) {
                        return [ {r: r1, c: c1}, {r: r1, c: c}, {r: r2, c: c}, {r: r2, c: c2} ];
                    }
                }
            }

            return null;
        }

        function checkDirect(r1, c1, r2, c2) {
            if (r1 !== r2 && c1 !== c2) return false;

            if (r1 === r2) {
                let minC = Math.min(c1, c2);
                let maxC = Math.max(c1, c2);
                for (let c = minC + 1; c < maxC; c++) {
                    if (board[r1][c] !== -1) return false;
                }
                return true;
            }

            if (c1 === c2) {
                let minR = Math.min(r1, r2);
                let maxR = Math.max(r1, r2);
                for (let r = minR + 1; r < maxR; r++) {
                    if (board[r][c1] !== -1) return false;
                }
                return true;
            }
            return false;
        }

        function hasValidMoves() {
            let activeTiles = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== -1) {
                        activeTiles.push({r, c, val: board[r][c]});
                    }
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].val === activeTiles[j].val) {
                        if (checkConnect({r: activeTiles[i].r, c: activeTiles[i].c}, {r: activeTiles[j].r, c: activeTiles[j].c})) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Render Board with Fallback handling for missing images[cite: 12]
        function renderBoard() {
            const gridEl = document.getElementById('tile-grid');
            gridEl.innerHTML = '';

            // 动态设置对应的网格列数样式类
            gridEl.className = ROWS === 10 ? 'grid-10' : ROWS === 15 ? 'grid-15' : 'grid-20';

            let remainingPairs = 0;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let val = board[r][c];
                    const tileDiv = document.createElement('div');
                    tileDiv.className = `tile rounded-lg flex items-center justify-center cursor-pointer shadow-sm border border-white/70 transition-all ${val === -1 ? 'opacity-0 pointer-events-none' : 'bg-white/95 hover:bg-white'}`;
                    tileDiv.dataset.r = r;
                    tileDiv.dataset.c = c;

                    if (val !== -1) {
                        remainingPairs++;
                        let imgSrc = imageUrls[val];
                        let fallbackLabel = FALLBACK_LABELS[val];

                        tileDiv.innerHTML = `
                            <img src="${imgSrc}" class="w-full h-full object-cover rounded-md pointer-events-none" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" alt="${val+1}.jpg">
                            <div class="w-full h-full items-center justify-center text-xs font-bold text-slate-600 bg-slate-100 rounded-md pointer-events-none" style="display:none;">${fallbackLabel}</div>
                        `;

                        tileDiv.onclick = () => onTileClick(r, c);
                    }

                    gridEl.appendChild(tileDiv);
                }
            }

            document.getElementById('pairs-left').innerText = remainingPairs;

            if (remainingPairs === 0 && gameState === 'PLAYING') {
                endGame(true);
            } else if (!hasValidMoves() && gameState === 'PLAYING') {
                showToast("自动刷新洗牌中...");
                shuffleTilesSilently();
                renderBoard();
            }
        }

        // Tile Click Handler[cite: 12]
        function onTileClick(r, c) {
            if (gameState !== 'PLAYING') return;
            if (board[r][c] === -1) return;

            const clickedTileEl = document.querySelector(`[data-r='${r}'][data-c='${c}']`);

            if (!selectedTile) {
                selectedTile = {r, c};
                clickedTileEl.classList.add('selected');
                playTone(400, 'sine', 0.08);
            } else {
                if (selectedTile.r === r && selectedTile.c === c) {
                    clickedTileEl.classList.remove('selected');
                    selectedTile = null;
                    return;
                }

                const prevEl = document.querySelector(`[data-r='${selectedTile.r}'][data-c='${selectedTile.c}']`);
                let path = checkConnect(selectedTile, {r, c});

                if (path) {
                    playMatchSound();
                    drawConnectingPath(path);

                    board[selectedTile.r][selectedTile.c] = -1;
                    board[r][c] = -1;

                    score += 10 * combo;
                    combo++;
                    document.getElementById('score-val').innerText = score;
                    document.getElementById('combo-val').innerText = combo + 'x';

                    if (prevEl) prevEl.classList.remove('selected');
                    selectedTile = null;

                    setTimeout(() => {
                        clearCanvas();
                        renderBoard();
                    }, 220);

                } else {
                    playErrorSound();
                    if (prevEl) prevEl.classList.remove('selected');
                    selectedTile = {r, c};
                    clickedTileEl.classList.add('selected');
                    combo = 1;
                    document.getElementById('combo-val').innerText = '1x';
                }
            }
        }

        // Draw Connecting Line on Canvas[cite: 12]
        function drawConnectingPath(path) {
            const canvas = document.getElementById('line-canvas');
            const container = document.getElementById('board-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            const ctx = canvas.getContext('2d');

            const gridEl = document.getElementById('tile-grid');
            const firstTile = gridEl.querySelector('.tile');
            if (!firstTile) return;
            const tileRect = firstTile.getBoundingClientRect();
            const cellW = tileRect.width;
            const cellH = tileRect.height;
            const gap = ROWS === 10 ? 3 : ROWS === 15 ? 2 : 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath();
            ctx.strokeStyle = '#ec4899';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowColor = '#f472b6';
            ctx.shadowBlur = 10;

            for (let i = 0; i < path.length; i++) {
                const tileX = (path[i].c * (cellW + gap)) + cellW / 2 + (gridEl.offsetLeft - container.scrollLeft);
                const tileY = (path[i].r * (cellH + gap)) + cellH / 2 + (gridEl.offsetTop - container.scrollTop);

                if (i === 0) {
                    ctx.moveTo(tileX, tileY);
                } else {
                    ctx.lineTo(tileX, tileY);
                }
            }
            ctx.stroke();
        }

        function clearCanvas() {
            const canvas = document.getElementById('line-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Hint Feature[cite: 12]
        function showHint() {
            if (gameState !== 'PLAYING') return;
            if (hintCount <= 0) {
                showToast("提示次数已用完！");
                return;
            }
            hintCount--;
            document.getElementById('hint-count').innerText = hintCount;

            let activeTiles = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c] !== -1) activeTiles.push({r, c, val: board[r][c]});
                }
            }

            for (let i = 0; i < activeTiles.length; i++) {
                for (let j = i + 1; j < activeTiles.length; j++) {
                    if (activeTiles[i].val === activeTiles[j].val) {
                        let path = checkConnect({r: activeTiles[i].r, c: activeTiles[i].c}, {r: activeTiles[j].r, c: activeTiles[j].c});
                        if (path) {
                            const el1 = document.querySelector(`[data-r='${activeTiles[i].r}'][data-c='${activeTiles[i].c}']`);
                            const el2 = document.querySelector(`[data-r='${activeTiles[j].r}'][data-c='${activeTiles[j].c}']`);
                            if (el1) el1.classList.add('hint-tile');
                            if (el2) el2.classList.add('hint-tile');

                            setTimeout(() => {
                                if (el1) el1.classList.remove('hint-tile');
                                if (el2) el2.classList.remove('hint-tile');
                            }, 1500);

                            playTone(700, 'sine', 0.15);
                            showToast("已高亮一对可消除方块！");
                            return;
                        }
                    }
                }
            }
            showToast("当前无解，正在洗牌...");
            shuffleTiles();
        }

        // Game Lifecycle Functions[cite: 12]
        function startGame() {
            gameState = 'PLAYING';
            timeLeft = GAME_DURATION;
            score = 0;
            combo = 1;
            shuffleCount = 3;
            hintCount = 5;

            document.getElementById('score-val').innerText = score;
            document.getElementById('shuffle-count').innerText = shuffleCount;
            document.getElementById('hint-count').innerText = hintCount;
            document.getElementById('combo-val').innerText = '1x';

            document.getElementById('btn-start').innerHTML = '<i class="fa-solid fa-gear"></i> 重新选择难度';
            document.getElementById('btn-pause').classList.remove('hidden');

            hideOverlay();
            generateSolvableBoard();
            renderBoard();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (gameState === 'PLAYING') {
                    timeLeft--;
                    updateTimerUI();
                    if (timeLeft <= 0) {
                        endGame(false);
                    }
                }
            }, 1000);
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                document.getElementById('btn-pause').innerHTML = '<i class="fa-solid fa-play"></i> 继续';
                showGameMessageModal("游戏已暂停", "点击下方按钮继续您的游戏", "fa-pause", false);
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('btn-pause').innerHTML = '<i class="fa-solid fa-pause"></i> 暂停';
                hideOverlay();
            }
        }

        function updateTimerUI() {
            const timerText = document.getElementById('timer-text');
            const timerBar = document.getElementById('timer-bar');
            timerText.innerText = timeLeft + 's';
            let pct = (timeLeft / GAME_DURATION) * 100;
            timerBar.style.width = pct + '%';

            if (timeLeft <= 30) {
                timerBar.className = 'bg-gradient-to-r from-red-500 to-amber-500 h-full transition-all duration-1000 rounded-full';
            } else {
                timerBar.className = 'bg-gradient-to-r from-indigo-500 to-pink-500 h-full transition-all duration-1000 rounded-full';
            }
        }

        function endGame(isWin) {
            gameState = isWin ? 'WON' : 'OVER';
            clearInterval(timerInterval);

            if (isWin) {
                playWinSound();
                showGameMessageModal("恭喜通关！ 🎉", `太棒了！您成功消除了所有方块。\n最终得分：${score} 分\n剩余时间：${timeLeft} 秒`, "fa-trophy", true);
            } else {
                playErrorSound();
                showGameMessageModal("时间到！ 😢", `非常遗憾，时间耗尽。\n最终得分：${score} 分，再接再厉！`, "fa-hourglass-end", true);
            }
        }

        function showGameMessageModal(title, desc, iconClass, showRestartBtn) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            document.getElementById('overlay-icon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
            document.getElementById('difficulty-selector').classList.add('hidden');
            
            const actionContainer = document.getElementById('overlay-action-container');
            actionContainer.classList.remove('hidden');
            document.getElementById('overlay-main-btn').innerHTML = showRestartBtn ? 
                `<i class="fa-solid fa-rotate-right"></i> 再玩一次` : 
                `<i class="fa-solid fa-play"></i> 继续游戏`;
            
            document.getElementById('overlay-main-btn').onclick = showRestartBtn ? showDifficultyModal : togglePause;

            const overlay = document.getElementById('game-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function hideOverlay() {
            const overlay = document.getElementById('game-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function showToast(msg) {
            let toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900/90 text-white px-5 py-2.5 rounded-2xl shadow-xl z-50 text-sm font-semibold transition-all duration-300';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        window.onload = function() {
            showDifficultyModal();
        };
    </script>
</body>
